name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
      - name: Look for the GTHL arena directory
        run: |
          mkdir -p fetched
          git show origin/main:scrape_schedule.py > scrape_schedule.py 2>/dev/null || true
          python diag_arenas.py
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Fetched sponsor assets"
          git push
