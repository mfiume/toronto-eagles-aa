name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tasios logos
        run: |
          mkdir -p fetched
          for f in tasios-ortho-logo.png tasios-ortho-logo-small.png tasios-logo-footer.png; do
            curl -fsSL -A "Mozilla/5.0" -o "fetched/$f" "https://tasiosortho.com/wp-content/uploads/2020/11/$f" || echo "$f failed"
          done
          ls -la fetched
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Fetched sponsor assets"
          git push
