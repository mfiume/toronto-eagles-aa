name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sponsor logos and look for Tasios
        run: |
          mkdir -p fetched
          curl -fsSL -A "Mozilla/5.0" -o fetched/performance-auto-group.png \
            "https://performanceprotection.info/wp-content/uploads/2013/03/Performance-Auto-Group.png" || echo "PAG failed"
          for site in tasiosortho.com www.tasiosortho.com tasiosorthodontics.com www.tasiosorthodontics.com tasiosortho.ca www.tasiosortho.ca tasiosorthodontics.ca www.tasiosorthodontics.ca; do
            if curl -fsSL -A "Mozilla/5.0" -m 20 -o "fetched/$site.html" "https://$site/"; then
              echo "== $site OK"
              grep -oiE '(src|href|content)="[^"]*(logo|\.svg|og-image)[^"]*"' "fetched/$site.html" | sort -u | head -20
            else
              echo "== $site failed"; rm -f "fetched/$site.html"
            fi
          done
          ls -la fetched
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Fetched sponsor assets"
          git push
