name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for the GTHL arena directory
        run: |
          mkdir -p fetched
          get() { curl -fsSL -A "Mozilla/5.0" -m 25 -o "fetched/$1" "$2" && echo "== $1 OK $(wc -c < fetched/$1)" || { echo "== $1 failed"; rm -f "fetched/$1"; }; }
          get home.html https://gthlcanada.com/
          get arenas.html https://gthlcanada.com/arenas/
          get arena.html https://gthlcanada.com/arena/
          get schedule.html https://gthlcanada.com/schedule/
          grep -ohiE 'href="[^"]*(arena|rink|facilit|venue)[^"]*"' fetched/*.html | sort -u | head -40
          grep -ohiE 'src="[^"]*agilex[^"]*"' fetched/*.html | sort -u | head
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Fetched sponsor assets"
          git push
