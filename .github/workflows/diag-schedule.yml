name: Diagnose
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the LiveBarn logo
        run: |
          mkdir -p assets
          curl -sSfL -A "Mozilla/5.0" -o assets/livebarn.png "https://www.livebarn.com/hubfs/L%20logo%20color.png"
          file assets/livebarn.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/livebarn.png
          git commit -m "LiveBarn logo (fetched)"
          git push
