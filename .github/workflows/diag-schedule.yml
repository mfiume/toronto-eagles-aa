name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fetch the TeamSnap calendar and commit it only in encrypted form, to a
      # public key whose private half lives in one Claude session. Nothing
      # readable reaches the repository or this log. The feed URL comes from
      # the TEAMSNAP_ICS_URL secret and is never printed.
      - name: Fetch and encrypt the team calendar
        env:
          ICS_URL: ${{ secrets.TEAMSNAP_ICS_URL }}
        run: |
          if [ -z "$ICS_URL" ]; then echo "TEAMSNAP_ICS_URL secret is not set yet"; exit 0; fi
          curl -fsSL -A "Mozilla/5.0" -o /tmp/team.ics "$ICS_URL"
          echo "Fetched $(wc -c < /tmp/team.ics) bytes, $(grep -c '^BEGIN:VEVENT' /tmp/team.ics) events"
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/team.ics -out fetched/team.ics.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey fetched/session-key.pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out fetched/team.key.enc
          rm -f /tmp/team.ics /tmp/k.bin
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Encrypted team calendar"
          git push
