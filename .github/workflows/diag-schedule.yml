name: Diagnose
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read LiveBarn's routes and sign-in redirect handling
        run: |
          mkdir -p diag
          B="https://watch.livebarn.com/js/ts-main.livebarn-dev-watch-web-2878-8b700cd8-2026-09-29.2.js"
          echo "bundle: $B" > diag/routes.txt
          curl -sS -A "Mozilla/5.0" "$B" -o /tmp/main.js
          python3 - <<'PY' >> diag/routes.txt
          import re
          js = open('/tmp/main.js', encoding='utf-8', errors='replace').read()
          def around(pat, n=6, w=500):
              out = []
              for m in list(re.finditer(pat, js))[:n]:
                  out.append(js[max(0, m.start()-w): m.end()+w].replace('\n', ' '))
              return out
          for pat in [r'video/:surfaceId/:date/:time', r'video/:surfaceId/live', r'returnUrl|redirectUrl|redirectTo|redirect_uri|"from"|nextPath|afterLogin',
                      r'apple-app-site|applinks|universal', r'livebarn://']:
              print('\n##########', pat)
              for s in around(pat): print('---\n' + s)
          PY
          curl -sS -A "Mozilla/5.0" https://watch.livebarn.com/.well-known/apple-app-site-association >> diag/routes.txt 2>&1 || true
          echo >> diag/routes.txt
          curl -sS -A "Mozilla/5.0" https://www.livebarn.com/.well-known/apple-app-site-association >> diag/routes.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "LiveBarn routes (fetched)" && git push
