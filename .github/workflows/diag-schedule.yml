name: Diagnose
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install selenium
      - name: Fetch the GTHL rulebook's tie-breaking rules with Chrome
        run: |
          mkdir -p diag
          python3 - <<'PY'
          import re, time
          from selenium import webdriver
          o = webdriver.ChromeOptions()
          for a in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1920,1080"):
              o.add_argument(a)
          d = webdriver.Chrome(options=o)
          d.get("https://gthlcanada.com/rulebook/")
          time.sleep(8)
          text = d.find_element("tag name", "body").text
          links = [a.get_attribute("href") for a in d.find_elements("tag name", "a")]
          d.quit()
          lines = [l.strip() for l in text.split("\n") if l.strip()]
          open("diag/rulebook.txt", "w").write("\n".join(lines) + "\n\nLINKS\n" + "\n".join(x for x in links if x))
          hits = [i for i, l in enumerate(lines) if re.search(r"\btie|tied|standing|winning percentage|coin", l, re.I)]
          out = []
          for i in hits:
              out.append(f"--- {i}")
              out.extend(lines[max(0, i-3): i+14])
          open("diag/ties.txt", "w").write("\n".join(out))
          print(len(lines), "lines", len(hits), "hits")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "GTHL rulebook text (fetched)" && git push
