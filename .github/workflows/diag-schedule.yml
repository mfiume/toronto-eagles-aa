name: Diagnose schedule scrape
on:
  push:
    branches: [claude/diag-schedule]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Shoxs site
        run: |
          mkdir -p fetched
          for site in shoxs.ca www.shoxs.ca; do
            curl -fsSL -A "Mozilla/5.0" -m 20 -o "fetched/$site.html" "https://$site/" && echo "== $site OK" || { echo "== $site failed"; rm -f "fetched/$site.html"; }
          done
          ls -la fetched
      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fetched
          git diff --staged --quiet || git commit -m "Fetched sponsor assets"
          git push
