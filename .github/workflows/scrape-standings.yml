name: Update Team Data

on:
  # Allow manual trigger
  workflow_dispatch:

  # Rebuild the pages as soon as the code that draws them changes. The pages
  # have to be built here, where the team password is: built anywhere else
  # they come out without the family log-in. The paths leave out the files
  # this workflow commits itself, so its own commits do not set it off again.
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'arenas.json'
      - 'team_scores.json'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/scrape-standings.yml'

  # Run every hour
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        run: |
          # The runner image usually has Chrome already. When it does not, add Google's repository
          # with a keyring file: apt-key no longer exists on current images.
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo install -d -m 0755 /etc/apt/keyrings
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

          # ChromeDriver is handled by selenium-manager in Selenium 4.15+
          echo "Chrome and ChromeDriver setup complete"

      # The GTHL's site sometimes fails to load for a moment, so each scrape
      # gets three tries. If all three fail, the last good data is kept and
      # the pages are still built, rather than the whole update stopping.
      - name: Run standings scraper
        run: |
          for attempt in 1 2 3; do
            python scrape_standings.py && exit 0
            echo "Standings scrape failed (attempt $attempt)"; sleep 30
          done
          echo "::warning::Standings scrape failed three times; keeping the last good standings"
          git checkout -- standings.json

      - name: Run schedule scraper
        run: |
          for attempt in 1 2 3; do
            python scrape_schedule.py && exit 0
            echo "Schedule scrape failed (attempt $attempt)"; sleep 30
          done
          echo "::warning::Schedule scrape failed three times; keeping the last good schedule"
          git checkout -- schedule.json season_schedule.json eagles_schedule.json

      - name: Cache team logos
        run: |
          python fetch_logos.py

      # The team's own calendar. The feed URL is a secret and never printed;
      # team_events.json stays on the runner and is never committed. The
      # schedule page carries it only encrypted with the team password.
      - name: Fetch team calendar
        env:
          TEAMSNAP_ICS_URL: ${{ secrets.TEAMSNAP_ICS_URL }}
        run: |
          python teamsnap.py

      - name: Generate HTML pages
        env:
          TEAM_EVENTS_PASSWORD: ${{ secrets.TEAM_EVENTS_PASSWORD }}
          AGILEX_HOCKEY_ID: ${{ secrets.AGILEX_HOCKEY_ID }}
          AGILEX_PERSONAL_CODE: ${{ secrets.AGILEX_PERSONAL_CODE }}
          AGILEX_LEAGUE: ${{ secrets.AGILEX_LEAGUE }}
          GAME_VIDEOS: ${{ secrets.GAME_VIDEOS }}
        run: |
          python livebarn.py
          python generate_html.py
          python generate_schedule_html.py
          python generate_playoffs_html.py
          python generate_privacy_html.py
          python generate_team_pages.py
          python agilex_sheets.py
          python generate_game_pages.py
          python generate_event_pages.py
          python generate_stats_html.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated files
          git add standings.json schedule.json season_schedule.json eagles_schedule.json livebarn_surfaces.json \
                  index.html schedule.html playoffs.html privacy.html statistics.html assets/logos
          git add -A -- 'team-*.html' 'game-*.html' 'event-*.html' || true
          # The sheets are kept sealed; this also removes the unsealed file the first time they are.
          git add -A -- game_sheets.sealed.json || true
          git add -A -- game_sheets.json || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Commit the scraped data first
            git commit -m "Update team data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            # Try to push, retry with pull if rejected
            if ! git push; then
              echo "Push rejected, pulling and retrying..."
              # Pull with ours strategy to keep our scraped data
              git pull --rebase -X ours origin main
              git push
            fi
          fi

      # A failed build leaves the old site up and says nothing, so say it: one issue is opened (GitHub emails
      # it, and the GitHub app pushes it to a phone) and it is closed again by the next build that works.
      - name: Open an issue when the build fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The site is not updating: the hourly build is failing"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "The build failed, so the schedule, scores and stats on the site are going stale. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Close the failing-build issue once the build works
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The site is not updating: the hourly build is failing"
          for n in $(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The build works again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
