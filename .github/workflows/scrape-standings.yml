name: Update Team Data

on:
  # Allow manual trigger
  workflow_dispatch:

  # Run every hour
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        run: |
          # Install Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # ChromeDriver is handled by selenium-manager in Selenium 4.15+
          echo "Chrome and ChromeDriver setup complete"

      - name: Run standings scraper
        run: |
          python scrape_standings.py

      - name: Run schedule scraper
        run: |
          python scrape_schedule.py

      - name: Generate HTML pages
        run: |
          python generate_html.py
          python generate_schedule_html.py
          python generate_playoffs_html.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated files
          git add standings.json schedule.json index.html schedule.html playoffs.html

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Commit the scraped data first
            git commit -m "Update team data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            # Try to push, retry with pull if rejected
            if ! git push; then
              echo "Push rejected, pulling and retrying..."
              # Pull with ours strategy to keep our scraped data
              git pull --rebase -X ours origin main
              git push
            fi
          fi
